name: 오류 신고
description: 재현 순서와 실제·예상 결과를 기록합니다.
title: "[fix][영역] 오류 요약"
body:
  - type: markdown
    attributes:
      value: |
        제목의 `[영역]`을 vision / detection / app / llm / data / integration / planning 중 하나로 바꿉니다.
        사용법과 이름 규칙은 CONTRIBUTING.md를 참고하세요.
  - type: dropdown
    id: platform
    attributes:
      label: 오류를 확인한 환경
      options:
        - Mac
        - Windows
        - Mac과 Windows 양쪽
        - 실행 환경과 무관하거나 아직 확인하지 못함
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경과 코드 버전
      description: 실제 확인한 정보만 적고 모르는 항목은 미확인으로 표시합니다.
      value: |
        - OS와 버전:
        - CPU·카메라 (관련 있을 때):
        - Python 버전:
        - 브랜치·커밋 또는 PR 번호:
        - 관련 패키지 버전:
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 다른 팀원이 같은 문제를 확인할 실행 순서·명령·입력을 적습니다.
      placeholder: "1. 실행 명령\n2. 입력 또는 키 동작\n3. 오류 발생 시점"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 나타난 현상과 반복 발생 여부를 적습니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 예상 결과
      description: 어떤 동작이 되어야 하는지 적습니다.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 로그와 시도한 해결 방법
      description: 오류 문구·확인한 방법·관련 이슈를 적습니다. 얼굴 영상·비밀키·개인 세션은 올리지 않습니다.
