name: macOS and Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install shared runtime
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Download official face model
        run: python scripts/download_model.py
      - name: Test without a camera
        run: python -m unittest discover -s tests -v
